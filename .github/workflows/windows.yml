name: Windows shell

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/ios/shell/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/shell
      - name: Check formatting
        run: cargo fmt --manifest-path ios/shell/Cargo.toml --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path ios/shell/Cargo.toml --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path ios/shell/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path ios/shell/Cargo.toml --locked
      - name: Check bundle and workflow definitions
        run: |
          python ios/scripts/package.py --dry-run
          python ios/scripts/test_pipeline.py
          python ios/scripts/check_workflows.py
      - name: Run shell GPU smoke
        run: powershell -NoProfile -File ios/scripts/windows-smoke.ps1
      - name: Upload Windows log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SilentHillPort-windows-evidence
          path: ios/out/windows-smoke/*.log
          if-no-files-found: warn
          retention-days: 14
