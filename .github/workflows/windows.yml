name: Windows native workspace

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: ./tools/dev-cargo.cmd clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (synthetic fixtures; no game data)
        run: ./tools/dev-cargo.cmd test --workspace --locked
      - name: Build native workspace
        run: ./tools/dev-cargo.cmd build --workspace --locked
      - name: Check disk32 layouts on 32-bit and 64-bit C
        run: ./tools/check-layouts.cmd

  ios-layouts:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Type-check disk32 and native pointer layouts for iOS arm64
        run: python3 tools/check-ios-layouts.py --compiler "$(xcrun --find clang)" --sysroot "$(xcrun --sdk iphoneos --show-sdk-path)"
