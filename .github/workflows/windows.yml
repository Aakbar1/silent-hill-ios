name: Windows native workspace

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: ./tools/dev-cargo.cmd clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (synthetic fixtures; no game data)
        run: ./tools/dev-cargo.cmd test --workspace --locked
      - name: Build native workspace
        run: ./tools/dev-cargo.cmd build --workspace --locked
