[package]
name = "silenthill-shell"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
log = "0.4"
pollster = "0.4"
wgpu = "24.0"
winit = "0.30.13"

[target.'cfg(target_os = "ios")'.dependencies]
raw-window-handle = "0.6"
objc2-ui-kit = { version = "0.2", default-features = false, features = ["UIView", "UIResponder", "UIGeometry"] }
